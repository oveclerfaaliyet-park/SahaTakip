<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANFA Vardiya Takip</title>
<style>
body{margin:0; padding:15px; font-family:'Segoe UI',sans-serif; text-transform: uppercase;}
.header{background:#064e3b; padding:20px; border-radius:20px; text-align:center; color:white; margin-bottom:15px;}
.card{background:#f9f9f9; padding:15px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.05); margin-bottom:15px;}
select { width:100%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ccc; text-transform: uppercase; }
.hidden { display:none !important;}
#takvimInfo { font-size:14px; color:#666; font-weight:bold; line-height:1.6; margin-top:10px;}
</style>
</head>
<body>

<div class="header">
    <h2>ANFA VARDİYA TAKİP</h2>
</div>

<div id="loginWarn" style="text-align:center; padding:10px;">
    <h3>Lütfen ana sayfadan Google ile giriş yapınız.</h3>
</div>

<div id="mainContent" class="card hidden">
    <label style="font-weight:bold; display:block; margin-bottom:8px;">AKTİF VARDİYA GRUBUNUZU SEÇİN</label>
    <select id="vardiyaGrupSelect" onchange="vardiyaKaydet(this.value)">
        <option value="Grup A">GRUP A (12/24 - 12/48 MODELİ)</option>
        <option value="Grup B">GRUP B (12/24 - 12/48 MODELİ)</option>
        <option value="Grup C">GRUP C (SABİT GÜNDÜZ)</option>
        <option value="Grup D">GRUP D (SABİT GECE)</option>
    </select>

    <div id="takvimInfo"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAs-Vl6_OicI8_gZ76-B8wLw9DkE5m_R7o",
    authDomain: "oveclerfaaliyet-park.firebaseapp.com",
    projectId: "oveclerfaaliyet-park",
    storageBucket: "oveclerfaaliyet-park.appspot.com",
    messagingSenderId: "543787729606",
    appId: "1:543787729606:web:806950ec09fbe79bdfbf65"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUserId = null;

onAuthStateChanged(auth, async (user) => {
    if(user) {
        currentUserId = user.uid;
        document.getElementById("loginWarn").classList.add("hidden");
        document.getElementById("mainContent").classList.remove("hidden");
        
        // Firestore'dan kayıtlı vardiya grubunu çek
        const docRef = doc(db, "users", user.uid, "config", "vardiyaSettings");
        const docSnap = await getDoc(docRef);
        if(docSnap.exists()) {
            document.getElementById("vardiyaGrupSelect").value = docSnap.data().grup;
        }
        ekranYazisiGuncelle();
    } else {
        currentUserId = null;
        document.getElementById("loginWarn").classList.remove("hidden");
        document.getElementById("mainContent").classList.add("hidden");
    }
});

window.vardiyaKaydet = async (grupAdi) => {
    if(!currentUserId) return;
    await setDoc(doc(db, "users", currentUserId, "config", "vardiyaSettings"), {
        grup: grupAdi,
        updatedAt: Date.now()
    });
    ekranYazisiGuncelle();
};

function ekranYazisiGuncelle() {
    const grup = document.getElementById("vardiyaGrupSelect").value;
    const simdi = new Date();
    document.getElementById("takvimInfo").innerHTML = `
        ŞU ANKİ TARİH: ${simdi.toLocaleDateString('tr-TR')}<br>
        SEÇİLİ SİSTEM: <strong>${grup}</strong> PLANLAMASI AKTİF.<br>
        <span style="color:#1b5e20;">✔ BULUT SENKRONİZASYONU SAĞLANDI.</span>
    `;
}
</script>
</body>
</html>
