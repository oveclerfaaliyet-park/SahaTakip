<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ANFA Takip</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignal.js" async=""></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "YOUR_ONESIGNAL_APP_ID_HERE",
          safari_web_id: "YOUR_SAFARI_WEB_ID_HERE",
          notifyButton: {
            enable: true,
          },
        });
      });
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f2f2f2; overflow-x: hidden; text-transform: uppercase; }
        #header { background: #1b5e20; color: white; height: 90px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-sizing: border-box; }
        #appTitle { text-align: center; font-family: 'Comic Sans MS', cursive; font-size: 32px; font-weight: bold; flex-grow: 1; }
        
        /* Kimlik Doğrulama Kartı Tasarımı */
        .auth-container { background: white; padding: 30px 20px; margin: 40px auto; max-width: 450px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; box-sizing: border-box; }
        .auth-container h2 { color: #1b5e20; margin-top: 0; font-size: 24px; }
        .auth-container p { color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .btn-auth { background: #4285F4; color: white; border: none; padding: 14px 28px; font-size: 16px; border-radius: 30px; cursor: pointer; display: inline-flex; align-items: center; gap: 12px; font-weight: bold; transition: background 0.2s, transform 0.1s; box-shadow: 0 4px 10px rgba(66,133,244,0.3); }
        .btn-auth:hover { background: #357ae8; transform: translateY(-1px); }
        .btn-auth:active { transform: translateY(1px); }
        
        /* Kullanıcı Profil Alanı */
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px white solid; object-fit: cover; }
        .btn-logout { background: #d32f2f; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: background 0.2s; }
        .btn-logout:hover { background: #b71c1c; }

        .hidden { display: none !important; }

        /* Sol Menü Yapısı */
        #menuBtn { font-size: 28px; cursor: pointer; color: white; }
        #menu { position: fixed; left: -240px; top: 0; width: 240px; height: 100%; background: #1b5e20; transition: 0.3s; z-index: 999; padding-top: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.3); }
        #menu a { display: block; padding: 15px 20px; color: white; text-decoration: none; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        #menu a:hover { background: #2e7d32; }
        
        /* Ana Görev Formu ve Tablo Alanı */
        #tasksBox { padding: 15px; max-width: 600px; margin: auto; }
        .form-group { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        .form-group input { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        #addBtn { width: 100%; background: #1b5e20; color: white; border: none; padding: 14px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        #addBtn:hover { background: #2e7d32; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #1b5e20; color: white; font-weight: bold; }
        .actions { display: flex; gap: 8px; }
        .actions button { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px; transition: transform 0.1s; }
        .actions button:hover { transform: scale(1.15); }
        .task-done { text-decoration: line-through; color: #888; background-color: #f9f9f9; }

        /* Iframe ve Geri Dönüş Yapısı */
        #content { display: none; width: 100%; height: calc(100vh - 90px); border: none; }
        #backFloat { position: fixed; bottom: 20px; right: 20px; background: #d32f2f; color: white; width: 50px; height: 50px; border-radius: 50%; display: none; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1001; }
        
        /* Ekran Koruyucu */
        #screenSaver { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 9999; display: none; justify-content: center; align-items: center; }
        #screenSaverClock { color: #00ff00; font-size: 80px; font-family: monospace; }
    </style>
</head>
<body>

<div id="header">
    <i class="fas fa-bars" id="menuBtn" onclick="toggleMenu()"></i>
    <div id="appTitle">ANFA TAKİP</div>
    
    <div id="userProfileArea" class="user-profile hidden">
        <img id="userAvatar" class="user-avatar" src="" alt="Profil">
        <button class="btn-logout" onclick="handleLogout()">ÇIKIŞ</button>
    </div>
</div>

<div id="loginScreen" class="auth-container">
    <h2>SAHA TAKİP SİSTEMİ</h2>
    <p>Uygulamayı kullanabilmek ve verilerinizi güvenli şekilde kaydetmek için lütfen Google hesabınızla giriş yapın.</p>
    <button class="btn-auth" onclick="handleLogin()">
        <i class="fab fa-google"></i> GOOGLE İLE GİRİŞ YAP
    </button>
</div>

<div id="menu">
    <a href="#" onclick="goHome()">ANA SAYFA / GÖREVLER</a>
    <a href="#" onclick="openPage('park_doluluk.html')">PARK DOLULUK RAPORU</a>
    <a href="#" onclick="openPage('olay_bildir.html')">OLAY BİLDİR PRO</a>
    <a href="#" onclick="openPage('personel_takip.html')">PERSONEL TAKİP</a>
    <a href="#" onclick="openPage('templates.html')">DİJİTAL TUTANAK</a>
    <a href="#" onclick="openPage('vardiya_takip.html')">VARDİYA TAKİP</a>
    <a href="#" onclick="openPage('filist.html')">ANFA REHBER PRO</a>
</div>

<div id="tasksBox" class="hidden">
    <div class="form-group">
        <label>YAPILACAK İŞ / GÖREV</label>
        <input type="text" id="taskInput" placeholder="GÖREV TANIMI GİRİNİZ...">
    </div>
    <div class="form-group">
        <label>BAŞLANGIÇ TARİHİ VE SAATİ</label>
        <input type="datetime-local" id="startDateTime">
    </div>
    <div class="form-group">
        <label>BİTİŞ TARİHİ VE SAATİ</label>
        <input type="datetime-local" id="endDateTime">
    </div>
    <button id="addBtn" onclick="handleAddTask()">LİSTEYE EKLE</button>

    <table>
        <thead>
            <tr>
                <th>GÖREV</th>
                <th>BAŞLANGIÇ</th>
                <th>BİTİŞ</th>
                <th>İŞLEM</th>
            </tr>
        </thead>
        <tbody id="taskList">
            </tbody>
    </table>
</div>

<iframe id="content"></iframe>
<div id="backFloat" onclick="goHome()"><i class="fas fa-arrow-left"></i></div>

<div id="screenSaver">
    <div id="screenSaverClock">00:00:00</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

  // Görsellerden Çekilen Gerçek Canlı API ve Proje Bilgileri
  const firebaseConfig = {
    apiKey: "AIzaSyAs-Vl6_OicI8_gZ76-B8wLw9DkE5m_R7o",
    authDomain: "oveclerfaaliyet-park.firebaseapp.com",
    projectId: "oveclerfaaliyet-park",
    storageBucket: "oveclerfaaliyet-park.appspot.com",
    messagingSenderId: "543787729606",
    appId: "1:543787729606:web:806950ec09fbe79bdfbf65"
  };

  // Firebase Servislerini Başlat
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let currentUserId = null;
  let unsubscribeTasks = null;

  // Google ile Giriş Yapma Tetikleyicisi
  window.handleLogin = async () => {
      try {
          await signInWithPopup(auth, provider);
      } catch (error) {
          console.error("Giriş Hatası:", error);
          alert("Giriş işlemi başarısız oldu: " + error.message);
      }
  };

  // Oturumu Kapatma Tetikleyicisi
  window.handleLogout = () => {
      signOut(auth).then(() => {
          location.reload();
      }).catch((error) => {
          console.error("Çıkış Hatası:", error);
      });
  };

  // Kullanıcı Durum Değişikliklerini Dinle (Auth Listener)
  onAuthStateChanged(auth, (user) => {
      if (user) {
          currentUserId = user.uid;
          
          // Arayüz Görünürlük Ayarları
          document.getElementById("loginScreen").classList.add("hidden");
          document.getElementById("tasksBox").classList.remove("hidden");
          document.getElementById("userProfileArea").classList.remove("hidden");
          document.getElementById("userAvatar").src = user.photoURL || "https://via.placeholder.com/38";
          
          // Kurallara uygun alt koleksiyon dinleyicisini çalıştır
          listenToUserTasks(user.uid);
      } else {
          currentUserId = null;
          if (unsubscribeTasks) unsubscribeTasks();
          
          document.getElementById("loginScreen").classList.remove("hidden");
          document.getElementById("tasksBox").classList.add("hidden");
          document.getElementById("userProfileArea").classList.add("hidden");
          document.getElementById("taskList").innerHTML = "";
      }
  });

  // Gerçek Zamanlı Firestore Veri Akışı (Kurallarla Uyumlu: users/{userId}/tasks)
  function listenToUserTasks(userId) {
      const tasksRef = collection(db, "users", userId, "tasks");
      // Yeni eklenen veya başlangıç tarihi en yakın olan görevleri en üstte listeler
      const q = query(tasksRef, orderBy("startTimestamp", "desc"));

      unsubscribeTasks = onSnapshot(q, (snapshot) => {
          const taskListHtml = document.getElementById('taskList');
          taskListHtml.innerHTML = "";
          
          snapshot.forEach((docSnapshot) => {
              const data = docSnapshot.data();
              const id = docSnapshot.id;
              
              const tr = document.createElement('tr');
              if (data.done) {
                  tr.classList.add('task-done');
              }
              
              tr.innerHTML = `
                <td>${data.task}</td>
                <td>${data.startDisplay || ''}</td>
                <td>${data.endDisplay || ''}</td>
                <td class="actions">
                  <button onclick="handleToggleDone('${id}', ${data.done || false})" title="Durumu Değiştir">✔</button>
                  <button onclick="handleDeleteTask('${id}')" title="Sil">🗑</button>
                </td>
              `;
              taskListHtml.appendChild(tr);
          });
      }, (error) => {
          console.error("Veri okuma/kural hatası:", error);
      });
  }

  // Yeni Görev Ekleme Mantığı
  window.handleAddTask = async () => {
      if (!currentUserId) return;
      
      const taskInput = document.getElementById('taskInput');
      const start = document.getElementById('startDateTime');
      const end = document.getElementById('endDateTime');

      if (taskInput.value.trim() === '') return;

      const taskText = taskInput.value.toUpperCase();
      const startVal = start.value ? new Date(start.value) : null;
      const startDisplay = startVal ? startVal.toLocaleString('tr-TR', { hour12: false }) : '';
      const endVal = end.value ? new Date(end.value) : null;
      const endDisplay = endVal ? endVal.toLocaleString('tr-TR', { hour12: false }) : '';

      try {
          await addDoc(collection(db, "users", currentUserId, "tasks"), {
              task: taskText,
              startDisplay: startDisplay,
              endDisplay: endDisplay,
              startTimestamp: startVal ? startVal.getTime() : 0,
              done: false,
              createdAt: Date.now()
          });

          // Form alanlarını sıfırla
          taskInput.value = '';
          start.value = '';
          end.value = '';
      } catch (error) {
          console.error("Görev ekleme hatası:", error);
          alert("Kayıt ekleme yetkiniz yok veya bir hata oluştu.");
      }
  };

  // Görevi Tamamlandı / Yapılacak Olarak İşaretleme
  window.handleToggleDone = async (id, currentStatus) => {
      if (!currentUserId) return;
      const taskDocRef = doc(db, "users", currentUserId, "tasks", id);
      try {
          await updateDoc(taskDocRef, {
              done: !currentStatus
          });
      } catch (error) {
          console.error("Güncelleme hatası:", error);
      }
  };

  // Görevi Kalıcı Olarak Silme
  window.handleDeleteTask = async (id) => {
      if (!currentUserId) return;
      if (confirm("BU GÖREVİ LİSTEDEN SİLMEK İSTEDİĞİNİZE EMİN MİSİNİZ?")) {
          const taskDocRef = doc(db, "users", currentUserId, "tasks", id);
          try {
              await deleteDoc(taskDocRef);
          } catch (error) {
              console.error("Silme hatası:", error);
          }
      }
  };
</script>

<script>
function toggleMenu() {
    const menu = document.getElementById("menu");
    if (menu.style.left === "0px") {
        menu.style.left = "-240px";
    } else {
        menu.style.left = "0px";
    }
}

function openPage(url) {
    document.getElementById("tasksBox").style.display = "none";
    document.getElementById("loginScreen").style.display = "none";
    
    const frame = document.getElementById("content");
    frame.style.display = "block";
    frame.src = url;

    document.getElementById("menu").style.left = "-240px";
    document.getElementById("backFloat").style.display = "flex";
}

function goHome() {
    // Kullanıcının oturum açıp açmadığını kontrol ederek ana ekrana döndür
    const isLoginHidden = document.getElementById("loginScreen").classList.contains("hidden");
    
    if (isLoginHidden) {
        document.getElementById("tasksBox").style.display = "block";
    } else {
        document.getElementById("loginScreen").style.display = "block";
    }
    
    document.getElementById("content").style.display = "none";
    document.getElementById("backFloat").style.display = "none";
    document.getElementById("content").src = "";
}

// Ekran Koruyucu Yönetimi (60 Saniye Hareketsizlik)
let sonDokunma = Date.now();
let ekranKoruyucuAcik = false;
const SCREEN_TIMEOUT = 60000;

function kullaniciHareketi() {
    sonDokunma = Date.now();
    if (ekranKoruyucuAcik) {
        ekranKoruyucuAcik = false;
        document.getElementById("screenSaver").style.display = "none";
    }
}

["touchstart", "click", "mousemove", "keydown", "scroll"].forEach(event => {
    document.addEventListener(event, kullaniciHareketi);
});

setInterval(() => {
    if (!ekranKoruyucuAcik && Date.now() - sonDokunma > SCREEN_TIMEOUT) {
        ekranKoruyucuAcik = true;
        document.getElementById("screenSaver").style.display = "flex";
    }
    if (ekranKoruyucuAcik) {
        const simdi = new Date();
        document.getElementById("screenSaverClock").innerText = simdi.toLocaleTimeString('tr-TR');
    }
}, 1000);
</script>

</body>
</html>
