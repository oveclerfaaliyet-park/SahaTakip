<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olay Bildir Pro</title>
<style>
body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin:0; padding:0; text-transform: uppercase; }
.container { max-width: 650px; margin: 20px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
input, select, textarea { width:100%; padding:10px; margin-bottom:12px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; text-transform: uppercase;}
button { width:100%; padding:12px; background:#0b462a; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;}
#output { background:#222; color:#fff; padding:15px; border-radius:6px; white-space:pre-wrap; font-family:monospace; margin-top:15px;}
.hidden { display:none !important; }
</style>
</head>
<body>

<div id="loginWarn" style="text-align:center; padding:5px;">
    <h3>Lütfen ana sayfadan Google ile giriş yapınız.</h3>
</div>

<div id="mainContent" class="container hidden">
    <h3>OLAY BİLDİR PRO</h3>
    <label>VARDİYA</label>
    <select id="vardiyaSelect">
        <option value="08:00 / 20:00">GÜNDÜZ (08:00 / 20:00)</option>
        <option value="20:00 / 08:00">GECE (20:00 / 08:00)</option>
    </select>

    <label>OLAY KONUSU</label>
    <input type="text" id="konuInput" placeholder="Örn: ŞÜPHELİ ŞAHIS UZAKLAŞTIRILMASI">

    <label>ETAP SEÇİMİ</label>
    <select id="etapSelect">
        <option value="1. Etap">1. ETAP</option>
        <option value="2. Etap">2. ETAP</option>
        <option value="3. Etap">3. ETAP</option>
        <option value="Park Geneli">PARK GENELİ</option>
    </select>

    <label>DETAYLI AÇIKLAMA</label>
    <textarea id="detayInput" rows="4" placeholder="Olay detaylarını yazınız..."></textarea>

    <button onclick="olusturMetin()">RAPORU HAZIRLA</button>
    <div id="output"></div>
    <button onclick="kopyalaMetin()" style="background:#4285F4; margin-top:10px;">KOPYALA</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAs-Vl6_OicI8_gZ76-B8wLw9DkE5m_R7o",
    authDomain: "oveclerfaaliyet-park.firebaseapp.com",
    projectId: "oveclerfaaliyet-park",
    storageBucket: "oveclerfaaliyet-park.appspot.com",
    messagingSenderId: "543787729606",
    appId: "1:543787729606:web:806950ec09fbe79bdfbf65"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
    if(user) {
        document.getElementById("loginWarn").classList.add("hidden");
        document.getElementById("mainContent").classList.remove("hidden");
    } else {
        document.getElementById("loginWarn").classList.remove("hidden");
        document.getElementById("mainContent").classList.add("hidden");
    }
});

window.olusturMetin = () => {
    const vardiya = document.getElementById("vardiyaSelect").value;
    const konu = document.getElementById("konuInput").value.toUpperCase();
    const etap = document.getElementById("etapSelect").value;
    const detay = document.getElementById("detayInput").value.toUpperCase();
    const simdi = new Date();

    let metin = `ANFA GÜVENLİK RAPORU\n`;
    metin += `TARİH: ${simdi.toLocaleDateString('tr-TR')} | SAAT: ${simdi.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'})}\n`;
    metin += `VARDİYA: ${vardiya}\n`;
    metin += `BÖLGE/ETAP: ${etap}\n`;
    metin += `KONU: ${konu}\n\n`;
    metin += `AÇIKLAMA: ${detay}\n\n`;
    metin += `BİLGİLERİNİZE ARZ EDERİM.`;

    document.getElementById("output").innerText = metin;
};

window.kopyalaMetin = () => {
    const out = document.getElementById("output").innerText;
    if(!out) return;
    navigator.clipboard.writeText(out);
    alert("RAPOR PANOYA KOPYALANDI!");
};
</script>
</body>
</html>
