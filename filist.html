<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ANFA REHBER PRO</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
:root{
--primary:#1b5e20;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
font-family:Segoe UI;
background:#0A0A0A;
color:white;
text-transform:uppercase;
/* Kaydırma sorunu için eklendi */
overflow-x: hidden;
}

header{
background:var(--primary);
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:999;
}

.settings-btn{
width:40px;
height:40px;
border:none;
border-radius:50%;
background:rgba(255,255,255,0.2);
color:white;
}

.search-wrapper{
padding:10px;
background:#111;
position: sticky;
top: 64px;
z-index: 998;
}

#searchBox{
width:100%;
padding:12px;
border-radius:25px;
border:2px solid var(--primary);
background:black;
color:white;
}

.birim-container{
margin:12px;
background:#111;
border-radius:12px;
overflow:hidden;
}

.birim-header{
padding:14px;
background:#0f2f12;
color:#7fe08a;
display:flex;
justify-content:space-between;
cursor:pointer;
}

/* Birim içeriği açıldığında kaydırmayı engellememesi için düzenlendi */
.birim-content{
display:none;
}

.birim-content.active{
display:block;
}

.personel-row{
display:flex;
align-items:center;
padding:14px;
border-bottom:1px solid #222;
cursor:pointer;
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
background:var(--primary);
display:flex;
justify-content:center;
align-items:center;
margin-right:12px;
}

.personel-actions{
margin-left:auto;
display:flex;
gap:10px;
}

.personel-actions i{
padding:6px;
border-radius:50%;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
justify-content:flex-end;
z-index:5000;
}

.sheet{
width:100%;
background:#111;
padding:20px;
border-radius:20px 20px 0 0;
align-self: flex-end; /* Alt kısma yapıştırıldı */
}

.act-btn{
padding:15px;
background:#1a1a1a;
border-radius:10px;
margin-bottom:8px;
font-weight:bold;
display:flex;
gap:12px;
align-items:center;
}

/* Popupların kaydırma sorunu giderildi */
.popup{
position:fixed;
inset:0;
background:#0A0A0A;
display:none;
flex-direction:column;
padding:20px;
z-index:3000;
overflow-y: auto; 
}

input,select,textarea{
width:100%;
padding:12px;
margin:6px 0;
background:black;
color:white;
border:1px solid #333;
border-radius:8px;
font-size: 16px; /* Mobil odaklanma zoomunu engeller */
}

.btn-full{
width:100%;
padding:14px;
border:none;
border-radius:8px;
color:white;
font-weight:bold;
margin-top:10px;
cursor: pointer;
}

.mgmt-item{
display:flex;
justify-content:space-between;
padding:12px;
background:#111;
margin:6px 0;
border-radius:8px;
}
</style></head><body onload="initApp()"><header>
<span>ANFA REHBER PRO</span>
<button class="settings-btn" onclick="openSettings()">
<i class="fa fa-cog"></i>
</button>
</header><div class="search-wrapper">
<input id="searchBox" placeholder="PERSONEL VEYA BİRİM ARA..." onkeyup="renderRehber()">
</div><div id="rehberListesi"></div><div id="actionSheet" class="overlay" onclick="closeActions()">
<div class="sheet" onclick="event.stopPropagation()">
<h3 id="selectedPersonName" style="text-align:center;color:#7fe08a"></h3><div class="act-btn" onclick="doAction('CALL')">
<i class="fa fa-phone" style="color:green"></i> ARA
</div><div class="act-btn" onclick="doAction('WHATSAPP')">
<i class="fab fa-whatsapp" style="color:#25D366"></i> WHATSAPP
</div><div class="act-btn" onclick="doAction('SMS')">
<i class="fa fa-comment"></i> SMS
</div><div class="act-btn" onclick="doAction('MEIL')">
<i class="fa fa-envelope" style="color:orange"></i> MAİL
</div><button class="btn-full" style="background:#666" onclick="closeActions()">İPTAL</button>

</div>
</div><div id="settingsPanel" class="popup"><div style="display:flex; justify-content: space-between; align-items: center;"><h3>REHBER YÖNETİMİ</h3><i class="fa fa-times" onclick="closeSettings()" style="font-size: 24px; padding: 10px;"></i></div><div style="display:flex;gap:10px">
<button class="btn-full" style="background:#1565c0" onclick="exportJSON()">
<i class="fa fa-download"></i> DIŞA AKTAR
</button><button class="btn-full" style="background:#ef6c00" onclick="document.getElementById('jsonFileInput').click()">
<i class="fa fa-upload"></i> İÇE AKTAR
</button>
</div><input type="file" id="jsonFileInput" style="display:none" onchange="importJSON(this)"><button class="btn-full" style="background:var(--primary)" onclick="openForm()">
+ YENİ PERSONEL EKLE
</button><h4>BİRİMLER</h4><div style="display:flex;gap:5px">
<input id="newUnitName" placeholder="YENİ BİRİM">
<button onclick="addItem('unit')" class="btn-full" style="width:auto;background:var(--primary)">+</button>
</div><div id="unitSettingsList"></div><h4>GÖREVLER</h4><div style="display:flex;gap:5px">
<input id="newJobName" placeholder="YENİ GÖREV">
<button onclick="addItem('job')" class="btn-full" style="width:auto;background:var(--primary)">+</button>
</div><div id="jobSettingsList"></div><button class="btn-full" style="background:#b71c1c;margin-top:30px" onclick="secureReset()">
SİSTEMİ SIFIRLA
</button></div><div id="formPopup" class="popup"><h3 id="formTitle">PERSONEL KAYDI</h3><input type="hidden" id="f_id"><select id="f_birim"></select>
<select id="f_gorev"></select>

<input id="f_ad_soyad" placeholder="AD SOYAD"><input id="f_tel" placeholder="TELEFON (5XXXXXXXXX)" maxlength="10" type="tel"><input id="f_mail" placeholder="E-POSTA" type="email"><textarea id="f_not" placeholder="NOT"></textarea><button class="btn-full" style="background:var(--primary)" onclick="savePersonel()">
KAYDET
</button><button class="btn-full" style="background:#666" onclick="closeForm()">
İPTAL
</button></div><script>

/* DATA */

let personeller = JSON.parse(localStorage.getItem("anfa_data")||"[]");
let birimler = JSON.parse(localStorage.getItem("anfa_units")||'["GENEL MÜDÜRLÜK","GÜVENLİK"]');
let gorevler = JSON.parse(localStorage.getItem("anfa_jobs")||'["MÜDÜR","AMİR","PERSONEL"]');

let tempPerson=null;

/* INIT */

function initApp(){
renderManagementLists();
renderRehber(); // Sıralama düzeltildi
}

/* RENDER */

function renderRehber(){

const q=document.getElementById("searchBox").value.toLocaleUpperCase("tr-TR");

const list=document.getElementById("rehberListesi");
list.innerHTML="";

const filtered=personeller.filter(p=>
(p.ad_soyad+" "+p.birim+" "+p.gorev)
.toLocaleUpperCase("tr-TR")
.includes(q)
);

if(filtered.length===0){
list.innerHTML="<p style='text-align:center;color:#777;margin-top:50px'>KAYIT YOK</p>";
return;
}

const gruplar={};

// Birimlerin boş olsa bile görünmesi isteniyorsa burası düzenlenebilir
// Mevcut yapıda sadece içinde personel olan birimler görünür
filtered.forEach(p=>{
if(!gruplar[p.birim]) gruplar[p.birim]=[];
gruplar[p.birim].push(p);
});

Object.keys(gruplar).sort().forEach(b=>{

let html=`<div class="birim-container">

<div class="birim-header" onclick="toggleBirim(this)">
<span>${b}</span>
<span>${gruplar[b].length}</span>
</div>

<div class="birim-content">`;

html+=gruplar[b].map(p=>`
<div class="personel-row" onclick="openActionsById(${p.id})">

<div class="avatar">${p.ad_soyad[0]}</div>

<div style="flex:1">
<b>${p.ad_soyad}</b><br>
<small>${p.gorev}</small>
</div>

<div class="personel-actions" onclick="event.stopPropagation()">
<i class="fa fa-edit" onclick="editPersonel(${p.id})"></i>
<i class="fa fa-trash" onclick="deletePersonel(${p.id})"></i>
</div>

</div>
`).join("");

list.innerHTML+=html+"</div></div>";

});

}

/* SETTINGS CRUD */

function renderManagementLists(){

document.getElementById("f_birim").innerHTML=
birimler.map(b=>`<option>${b}</option>`).join("");

document.getElementById("f_gorev").innerHTML=
gorevler.map(g=>`<option>${g}</option>`).join("");

document.getElementById("unitSettingsList").innerHTML=
birimler.map(b=>`
<div class="mgmt-item">
<span>${b}</span>
<i class="fa fa-trash" onclick="deleteItem('unit','${b}')"></i>
</div>`).join("");

document.getElementById("jobSettingsList").innerHTML=
gorevler.map(g=>`
<div class="mgmt-item">
<span>${g}</span>
<i class="fa fa-trash" onclick="deleteItem('job','${g}')"></i>
</div>`).join("");

}

/* ACTIONS */

function openActionsById(id){

const p=personeller.find(x=>x.id===id);

if(!p) return;

tempPerson=p;

document.getElementById("selectedPersonName").innerText=p.ad_soyad;

document.getElementById("actionSheet").style.display="flex";
}

function closeActions(){
document.getElementById("actionSheet").style.display="none";
}

function doAction(act){

const veri=act+","+tempPerson.ad_soyad+","+tempPerson.tel+","+(tempPerson.mail||"-");

if(window.AppInventor){
window.AppInventor.setWebViewString(veri);
}

closeActions();
}

/* CRUD */

function addItem(type){

const inp=document.getElementById(type==="unit"?"newUnitName":"newJobName");

const val=inp.value.trim().toUpperCase();

if(!val) return;

if(type==="unit") {
    if(!birimler.includes(val)) birimler.push(val);
} else {
    if(!gorevler.includes(val)) gorevler.push(val);
}

localStorage.setItem(type==="unit"?"anfa_units":"anfa_jobs",
JSON.stringify(type==="unit"?birimler:gorevler));

inp.value="";

renderManagementLists();
renderRehber(); // Değişiklik sonrası listeyi tazele
}

function deleteItem(type,val){

if(!confirm("BU BİRİM/GÖREV SİLİNSİN Mİ?")) return;

if(type==="unit") birimler=birimler.filter(x=>x!==val);
else gorevler=gorevler.filter(x=>x!==val);

localStorage.setItem(type==="unit"?"anfa_units":"anfa_jobs",
JSON.stringify(type==="unit"?birimler:gorevler));

renderManagementLists();
renderRehber();
}

/* PERSONEL */

function savePersonel(){

const id=document.getElementById("f_id").value;
const isim=document.getElementById("f_ad_soyad").value.trim().toUpperCase();
let telInput=document.getElementById("f_tel").value.replace(/\D/g,'');

if(!isim || telInput.length < 10){
alert("LÜTFEN AD VE GEÇERLİ TELEFON GİRİNİZ");
return;
}

// Numara formatı düzeltme
let tel = "+90" + telInput.slice(-10);

const pData={
id:id?parseInt(id):Date.now(),
ad_soyad:isim,
tel:tel,
mail:document.getElementById("f_mail").value,
birim:document.getElementById("f_birim").value,
gorev:document.getElementById("f_gorev").value
};

if(id){
const idx=personeller.findIndex(x=>x.id===parseInt(id));
if(idx>-1) personeller[idx]=pData;
}else{
personeller.push(pData);
}

localStorage.setItem("anfa_data",JSON.stringify(personeller));

closeForm();
renderRehber();
}

/* FORM */

function openSettings(){
document.getElementById("settingsPanel").style.display="flex";
}

function closeSettings(){
document.getElementById("settingsPanel").style.display="none";
}

function openForm(){
document.getElementById("f_id").value="";
document.getElementById("f_ad_soyad").value="";
document.getElementById("f_tel").value="";
document.getElementById("f_mail").value="";
document.getElementById("formTitle").innerText="PERSONEL KAYDI";
document.getElementById("formPopup").style.display="flex";
}

function closeForm(){
document.getElementById("formPopup").style.display="none";
}

/* UTIL */

function toggleBirim(el){
el.nextElementSibling.classList.toggle("active");
}

function editPersonel(id){

const p=personeller.find(x=>x.id===id);
if(!p) return;

document.getElementById("f_id").value=p.id;
document.getElementById("f_ad_soyad").value=p.ad_soyad;
document.getElementById("f_tel").value=p.tel.replace("+90","");
document.getElementById("f_mail").value=p.mail||"";
document.getElementById("f_birim").value=p.birim;
document.getElementById("f_gorev").value=p.gorev;

document.getElementById("formTitle").innerText="KAYDI DÜZENLE";
document.getElementById("formPopup").style.display="flex";
}

function deletePersonel(id){

if(!confirm("PERSONEL SİLİNSİN Mİ?")) return;

personeller=personeller.filter(x=>x.id!==id);

localStorage.setItem("anfa_data",JSON.stringify(personeller));

renderRehber();
}

/* EXPORT IMPORT */

function exportJSON(){
const data={personeller,birimler,gorevler,exportTarihi:new Date().toISOString()};
const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="anfa_rehber_yedek.json";
a.click();
}

function importJSON(input){
const file=input.files[0];
if(!file) return;
const reader=new FileReader();
reader.onload=e=>{
try{
const data=JSON.parse(e.target.result);
if(data.personeller) { personeller=data.personeller; localStorage.setItem("anfa_data",JSON.stringify(personeller)); }
if(data.birimler) { birimler=data.birimler; localStorage.setItem("anfa_units",JSON.stringify(birimler)); }
if(data.gorevler) { gorevler=data.gorevler; localStorage.setItem("anfa_jobs",JSON.stringify(gorevler)); }
renderManagementLists();
renderRehber();
alert("VERİLER BAŞARIYLA YÜKLENDİ");
}catch{ alert("JSON DOSYASI HATALI"); }
};
reader.readAsText(file);
input.value="";
}

function secureReset(){
const sifre=prompt("GÜVENLİK ŞİFRESİNİ GİRİN:");
if(sifre==="anfa2026"){
if(confirm("DİKKAT! TÜM VERİLER SİLİNECEK. EMİN MİSİNİZ?")){
localStorage.clear();
location.reload();
}
}else if(sifre!==null){
alert("HATALI ŞİFRE!");
}
}

</script></body>
</html>
