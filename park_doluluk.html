<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANFA Güvenlik - Park Doluluk</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body{ font-family:'Poppins',sans-serif; margin:0; min-height:100vh; background:#fff; color:#0b2c4d; text-transform: uppercase; }
header{ background:#0b5d1e; color:#fff; padding:20px; display:flex; justify-content:space-between; align-items:center; font-size:18px; font-weight:600; }
.container{padding:20px;max-width:600px;margin:auto}
.card{ background:rgba(255,255,255,.95); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 8px 20px rgba(0,0,0,.15); }
label{font-weight:600;display:block;margin-bottom:6px}
input,select{ width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; box-sizing:border-box; margin-bottom:10px; font-size:16px; text-transform: uppercase; }
button{ width:100%; background:#0b5d1e; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:16px; }
.modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index:2000; }
.modal-content { background:white; padding:20px; border-radius:12px; width:90%; max-width:400px; }
.hidden { display: none !important; }
#raporText { background:#eee; padding:15px; border-radius:8px; white-space:pre-wrap; font-family:monospace; margin-top:10px; }
</style>
</head>
<body>

<header>
    <span id="headerTitle">PARK DOLULUK</span>
    <button style="width:auto; padding:5px 10px; background:rgba(255,255,255,0.2);" onclick="openSettings()">⚙ AYARLAR</button>
</header>

<div id="loginWarn" class="container" style="text-align:center; margin-top:40px;">
    <h3>Lütfen ana sayfadan Google ile giriş yapınız.</h3>
</div>

<div id="mainContent" class="container hidden">
    <div class="card">
        <label>VARDİYA SEÇİNİZ</label>
        <select id="vardiyaSelect">
            <option id="v1" value="08:00/20:00">08:00/20:00</option>
            <option id="v2" value="20:00/08:00">20:00/08:00</option>
        </select>

        <label>DOLULUK ORANI (%)</label>
        <input type="number" id="dolulukInput" placeholder="Örn: 45">

        <label>VATANDAŞ SAYISI</label>
        <input type="number" id="vatandasInput" placeholder="Örn: 150">
    </div>

    <div class="card">
        <h4>RAPOR METNİ</h4>
        <div id="raporText"></div>
        <button onclick="kopyalaRapor()" style="margin-top:10px; background:#4285F4;">METNİ KOPYALA</button>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3>Sistem Ayarları</h3>
        <label>BÖLGE ADI</label>
        <input type="text" id="bolgeSet">
        <label>PARK ADI</label>
        <input type="text" id="parkSet">
        <label>VARDİYA 1 SAATLERİ</label>
        <input type="text" id="vardiya1Set">
        <label>VARDİYA 2 SAATLERİ</label>
        <input type="text" id="vardiya2Set">
        <button onclick="saveSettings()">AYARLARI KAYDET</button>
        <button onclick="closeSettings()" style="background:#d32f2f; margin-top:5px;">KAPAT</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAs-Vl6_OicI8_gZ76-B8wLw9DkE5m_R7o",
    authDomain: "oveclerfaaliyet-park.firebaseapp.com",
    projectId: "oveclerfaaliyet-park",
    storageBucket: "oveclerfaaliyet-park.appspot.com",
    messagingSenderId: "543787729606",
    appId: "1:543787729606:web:806950ec09fbe79bdfbf65"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUserId = null;
let userSettings = {
    bolge: "DİKMEN BÖLGESİ",
    park: "ÖVEÇLER VADİSİ PARKI",
    v1: "08:00/20:00",
    v2: "20:00/08:00"
};

onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUserId = user.uid;
        document.getElementById("loginWarn").classList.add("hidden");
        document.getElementById("mainContent").classList.remove("hidden");
        
        // Firestore'dan kullanıcının özel ayarlarını oku
        const docRef = doc(db, "users", user.uid, "config", "parkSettings");
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
            userSettings = docSnap.data();
        }
        applySettingsToUI();
    } else {
        currentUserId = null;
        document.getElementById("loginWarn").classList.remove("hidden");
        document.getElementById("mainContent").classList.add("hidden");
    }
});

function applySettingsToUI() {
    document.getElementById("v1").value = userSettings.v1;
    document.getElementById("v1").innerText = userSettings.v1;
    document.getElementById("v2").value = userSettings.v2;
    document.getElementById("v2").innerText = userSettings.v2;
    buildText();
}

window.openSettings = () => {
    document.getElementById("bolgeSet").value = userSettings.bolge;
    document.getElementById("parkSet").value = userSettings.park;
    document.getElementById("vardiya1Set").value = userSettings.v1;
    document.getElementById("vardiya2Set").value = userSettings.v2;
    document.getElementById("settingsModal").style.display = "flex";
};

window.closeSettings = () => {
    document.getElementById("settingsModal").style.display = "none";
};

window.saveSettings = async () => {
    if(!currentUserId) return;
    userSettings = {
        bolge: document.getElementById("bolgeSet").value.toUpperCase(),
        park: document.getElementById("parkSet").value.toUpperCase(),
        v1: document.getElementById("vardiya1Set").value,
        v2: document.getElementById("vardiya2Set").value
    };
    await setDoc(doc(db, "users", currentUserId, "config", "parkSettings"), userSettings);
    applySettingsToUI();
    closeSettings();
};

function buildText() {
    const vSelect = document.getElementById("vardiyaSelect").value;
    const doluluk = document.getElementById("dolulukInput").value || "0";
    const vatandas = document.getElementById("vatandasInput").value || "0";
    const simdi = new Date();
    
    let text = `${simdi.toLocaleDateString('tr-TR')} TARİHİNDE\n`;
    text += `${vSelect} VARDİYASINDA\n`;
    text += `${simdi.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'})} SAATİNDE ${userSettings.park} \n\n`;
    text += `DOLULUK ORANI : %${doluluk}\n`;
    text += `VATANDAŞ SAYISI: ${vatandas}\n\n`;
    text += `BİLGİNİZE MÜDÜRÜM.`;
    
    document.getElementById("raporText").innerText = text;
}

window.kopyalaRapor = () => {
    const text = document.getElementById("raporText").innerText;
    navigator.clipboard.writeText(text);
    alert("RAPOR METNİ PANOYA KOPYALANDI!");
};

["vardiyaSelect", "dolulukInput", "vatandasInput"].forEach(id => {
    document.getElementById(id).addEventListener("input", buildText);
});
</script>
</body>
</html>
