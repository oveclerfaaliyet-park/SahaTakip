<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>ANFA Personel Takip</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Segoe UI;background:#f2f2f2;margin:0; text-transform: uppercase;}
header{background:#1b5e20;color:white;text-align:center;padding:12px; font-weight:bold;}
button{background:#4caf50;color:white;border:none;padding:8px 14px;border-radius:8px; cursor:pointer;}
.card{background:white;margin:10px;padding:12px;border-radius:12px;box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
input,select{width:100%;padding:8px;margin:6px 0; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; text-transform: uppercase;}
.hidden{display:none !important;}
table{width:100%;border-collapse:collapse; margin-top:10px;}
td,th{border:1px solid #ccc;padding:8px;text-align:left}
th{background:#1b5e20; color:white;}
</style>
</head>
<body>

<header>ANFA PERSONEL TAKİP SİSTEMİ</header>

<div id="loginWarn" style="text-align:center; padding:20px;">
    <h3>Lütfen ana sayfadan Google ile giriş yapınız.</h3>
</div>

<div id="mainContent" class="container hidden">
    <div class="card">
        <h3>YENİ PERSONEL EKLE</h3>
        <input type="text" id="pAd" placeholder="AD SOYAD">
        <input type="text" id="pTel" placeholder="TELEFON NUMARASI">
        <input type="text" id="pYaka" placeholder="YAKA NUMARASI">
        <button onclick="personelEkle()">KAYDET</button>
    </div>

    <div class="card">
        <h3>PERSONEL LİSTESİ</h3>
        <table>
            <thead>
                <tr>
                    <th>AD SOYAD</th>
                    <th>TELEFON</th>
                    <th>YAKA NO</th>
                    <th>İŞLEM</th>
                </tr>
            </thead>
            <tbody id="personelTableBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAs-Vl6_OicI8_gZ76-B8wLw9DkE5m_R7o",
    authDomain: "oveclerfaaliyet-park.firebaseapp.com",
    projectId: "oveclerfaaliyet-park",
    storageBucket: "oveclerfaaliyet-park.appspot.com",
    messagingSenderId: "543787729606",
    appId: "1:543787729606:web:806950ec09fbe79bdfbf65"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUserId = null;
let unsub = null;

onAuthStateChanged(auth, (user) => {
    if(user) {
        currentUserId = user.uid;
        document.getElementById("loginWarn").classList.add("hidden");
        document.getElementById("mainContent").classList.remove("hidden");
        personelDinle(user.uid);
    } else {
        currentUserId = null;
        if(unsub) unsub();
        document.getElementById("loginWarn").classList.remove("hidden");
        document.getElementById("mainContent").classList.add("hidden");
    }
});

function personelDinle(userId) {
    const q = query(collection(db, "users", userId, "personel"));
    unsub = onSnapshot(q, (snapshot) => {
        const tbody = document.getElementById("personelTableBody");
        tbody.innerHTML = "";
        snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const id = docSnap.id;
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${data.ad}</td>
                <td>${data.tel}</td>
                <td>${data.yaka}</td>
                <td><button style="background:#d32f2f;" onclick="personelSil('${id}')">SİL</button></td>
            `;
            tbody.appendChild(tr);
        });
    });
}

window.personelEkle = async () => {
    if(!currentUserId) return;
    const ad = document.getElementById("pAd").value.toUpperCase();
    const tel = document.getElementById("pTel").value;
    const yaka = document.getElementById("pYaka").value.toUpperCase();

    if(!ad) return alert("AD ALANI BOŞ BIRAKILAMAZ");

    await addDoc(collection(db, "users", currentUserId, "personel"), {
        ad, tel, yaka, createdAt: Date.now()
    });

    document.getElementById("pAd").value = "";
    document.getElementById("pTel").value = "";
    document.getElementById("pYaka").value = "";
};

window.personelSil = async (id) => {
    if(!currentUserId) return;
    if(confirm("PERSONELİ SİLMEK İSTEDİĞİNİZE EMİN MİSİNİZ?")) {
        await deleteDoc(doc(db, "users", currentUserId, "personel", id));
    }
};
</script>
</body>
</html>
